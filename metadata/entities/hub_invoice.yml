# PLACEHOLDER BRONZE TABLE, IN A FAKE CATALOG, DELIBERATELY -- see hub_supplier.yml for
# the full reasoning; this file only records what differs.
#
# Task 1 built the Fieldglass invoice source union but did NOT declare it in
# metadata/source_unions.yml, because a declared union with zero real tables behind it
# makes checks/apply_source_unions.py return 1 on every run and takes the LIVE
# fieldglass_us_job_posting load down with it -- a placeholder here must not be able to
# do the same. Pointing bronze_table at the real union view name
# (02_usnc_silver_edm_dev.raw_vault.v_fieldglass_us_invoice) would be exactly that: a
# real-looking reference to a view nothing has created yet.
#
# So this binding names a table in the fake `hfig_usnc.bronze` PLACEHOLDER catalog
# instead -- the same convention sat_job_request_details.yml uses for its own
# not-yet-ready Fieldglass binding, and hub_legal_entity.yml uses for its whole family
# (PLACEHOLDER.reference.legal_entity). verify_repo's active-sources gate is "reads
# 01_usnc_bronze_dev. => real => must be in active_sources"; a fake catalog never
# matches that prefix, so it cannot trip the gate the way a real-looking placeholder
# would.
#
# REPOINT THIS AND DECLARE THE SOURCE UNION IN THE SAME CHANGE. Both halves of "the
# invoice feed is ready" land together: metadata/source_unions.yml gets the Fieldglass
# invoice union entry, and every PLACEHOLDER bronze_table below (this file,
# hub_supplier.yml, and the FIELDGLASS_US bindings on hub_organisation.yml and
# hub_worker.yml) is repointed at
# 02_usnc_silver_edm_dev.raw_vault.v_fieldglass_us_invoice. Landing one half without the
# other reproduces the exact landmine Task 1 avoided, just moved to invoice instead of
# job_posting.
name: invoice
kind: hub
domain: pay_bill
# TENANT_SCOPED THOUGH IT LOOKS REDUNDANT TODAY, deliberately.
# A Fieldglass invoice id already embeds the buyer -- AEE1IN00123410 -- so keying on
# the id alone would be unique across all 54 clients right now. It is scoped anyway
# because this hub will take Beeline and VNDLY next, and neither is guaranteed to
# namespace its identifiers. Adding the scope later is a re-key of every row; adding
# it now costs one column.
key_style: tenant_scoped
business_keys: [invoice_tenant, invoice_reference]
tenant_key: [invoice_tenant]
sensitivity: internal
sources:
  # PLACEHOLDER, REPOINTED IN THE SAME CHANGE AS THE SOURCE UNION (see header). Real
  # key columns -- Task 1's union view carries buyer and invoice_id -- but the table
  # itself does not exist yet, so it is named through the fake PLACEHOLDER catalog
  # rather than the real one.
  - name: FIELDGLASS_US
    # READS THE BRONZE TABLE DIRECTLY, with the profile's filter and renames applied
    # in the flow (conform:) instead of through a view. A masked entity reading a view
    # cannot be built -- SDP reconciles the streaming plan against the declared schema
    # at definition time and never finished. 25 September.
    bronze_table: 01_usnc_bronze_dev.sap_fieldglass_raw.invoices
    # GENERATION 2 since 28 September 2026. Bronze dropped and recreated this table
    # (new Delta id 06b65224-ef33-44fb-beb5-6ca4892277fb), so the generation-1
    # checkpoint names a Delta object that no longer exists and this flow fails at
    # analysis with [DIFFERENT_DELTA_TABLE_READ_BY_STREAMING_SOURCE]. See
    # SourceBinding.stream_generation: a fresh checkpoint re-reads the source and
    # APPENDS, and the duplicate staging rows dissolve at the hub anti-join.
    stream_generation: 2
    conform: fieldglass_us_invoice
    # WEEKLY, per Amy's 22 September template: "Invoice frequency: Weekly", delivered
    # Thursdays by sFTP. NOT an exemption -- a 0 here means a feed that legitimately never
    # re-delivers, and this one is meant to.
    #
    # IT WILL REPORT A BREACH TODAY, AND THAT IS THE POINT. Measured 24 September: this
    # feed has landed three times -- 5 rows on 8 Sep, 30 on 9 Sep, 1,172 on 11 Sep -- and
    # nothing in the thirteen days since. So it is not yet the weekly feed the template
    # describes. Declaring the real SLA makes that visible; exempting it would hide a
    # silent feed behind a decision that looks deliberate.
    freshness_sla_hours: 168
    key_columns: [buyer_tenant, invoice_id]
    # THE FEED RE-DELIVERS, so the hub collapses copies on its own key rather than
    # staging one row per delivery. Required of every binding reading a real Bronze
    # table since this one stopped reading a view: the conformance moved into the flow,
    # the re-delivery did not go away with it.
    dedup_by: [buyer_tenant, invoice_id]
    dedup_order: [invoice_submit_date]
    applied_dts_column: invoice_submit_date
