# THE CLIENT HUB -- one of the two halves hub_organisation split into on 29 September 2026.
#
# WHY THE SPLIT, AND WHY NOT A RENAME. hub_organisation held two different kinds of party
# under one vague word. Of its thirteen rows in usnc_tds, ONE is a client -- AEE1, Ameren --
# and eleven are Guidant's own operating companies (BARM, BRPLM, GGI, the SPVs). Renaming
# the hub to hub_client was considered and REJECTED: it would have made the name false for
# the majority of its rows, which is the same defect the old name had, pointed the other
# way. A word that is wrong about most of what it names is not a naming problem, it is a
# modelling one, and the fix is two hubs.
#
# THE DISCRIMINATOR WAS ALREADY DECLARED, so the split needed no judgement. Every binding
# carried a `reference_type` key literal, and that literal separates the two populations
# exactly:
#
#   ('Fieldglass_Buyer_Code', 'AEE1')        a client, from Fieldglass
#   ('Portal_Client_Code',    'ACME')        a client, from the portal / Striive
#   ('Organization_Reference_ID', 'BRPLM')   OUR legal entity -- hub_operating_company
#
# The bindings were assigned by that literal alone. Nothing was reclassified by hand.
#
# NOT ONE HASH KEY MOVED, AND THAT IS THE LOAD-BEARING CLAIM. spec.key_scope_of returns
# the BINDING name, never the entity name, and this hub's key_style is `authored` -- so the
# hash-key expression of every binding here is a function of business_keys, key_columns and
# key_literals only, all copied verbatim from hub_organisation. tests/test_accelerator.py
# proves it against tests/golden_key_expressions.json, which was rendered BEFORE the split
# (tools/emit_key_expressions.py, commit 59a3060) and is not regenerated by it. Had a key
# moved, every already-loaded row would keep the old digest and nothing would join -- and
# that failure is SILENT: append_only and reconciliation both still pass.
#
# THE COLUMN NAME DID MOVE, deliberately: `organisation_hk` is now `client_hk` here and
# `operating_company_hk` on the other hub. A column rename is a schema migration, which is
# recoverable; a digest change is not. The check distinguishes the two by comparing the
# EXPRESSION under the renamed identity rather than the identity itself.
#
# KEY_STYLE IS AUTHORED, inherited unchanged. The reference type already scopes the value,
# so no source scope is needed; see hub_operating_company.yml, which carries the same
# reasoning and the bindings the argument was originally written about.
#
# NO PAYLOAD. A hub carries identity, never description. `name`, `class` and `status`
# belong on a satellite of this hub, and the structural refusal that no hub or link may
# declare `payload` already reaches this entity -- it is scoped by KIND, over the whole
# loaded model, so a new hub is covered the moment it loads. No second check is added here
# on purpose: a rule asserted twice is a rule with two places to drift, and this repo has
# been bitten by exactly that (BUSINESS_KINDS, the system-column set, the append-only
# prefix list).
#
# SEVERAL ROWS FOR ONE REAL CLIENT IS CORRECT until they are resolved. A hub records
# asserted identities, not resolved ones; cross-source resolution is a same-as link,
# downstream in entity resolution, outside this accelerator.
#
# ONE BINDING PER SOURCE NAME ANY CHILD USES. spec.parent_key_components refuses to derive
# a literal-keyed parent's key from a child binding whose source name this hub does not
# itself carry -- because the literal would be omitted and the child's FK would point at a
# hub row that never exists, silently. Every source name below exists because some child
# reads under it:
#
#   FIELDGLASS_US       nhl_invoice_line, sat_invoice_line_details
#   BUSINESS_VAULT_GIE  csat_invoice_line_gie, reaching client via invoice_line
#   STRIIVE_EU          nhl_timesheet_line, lnk_client_job_request
#   CLIENT_PORTAL       the system that mints Portal_Client_Code
name: client
kind: hub
domain: party
key_style: authored
business_keys: [reference_type, reference_id]
sensitivity: internal

sources:
  # PLACEHOLDER. This binding came here from the original hub_client.yml, which folded
  # into hub_organisation before the 29 September split undid that fold -- so it is back
  # where it started. The Client Portal mints the enterprise client code, which is why the
  # key needs no source scope: the same client is the same client whichever system
  # reports it.
  - name: CLIENT_PORTAL
    bronze_table: hfig_eu.bronze.portal_client
    key_columns: [client_code]
    key_literals:
      reference_type: Portal_Client_Code
    applied_dts_column: updated_at
    cdc_op_column: _cdc_op

  # PLACEHOLDER. Striive reports the portal's client code, so it asserts the same
  # identity under the same reference type -- not a second one.
  - name: STRIIVE_EU
    bronze_table: hfig_eu.bronze.striive_job_request
    key_columns: [client_code]
    key_literals:
      reference_type: Portal_Client_Code
    cdc_op_column: _cdc_op

  # PLACEHOLDER CATALOG, FAKE ON PURPOSE -- same reasoning as hub_invoice.yml and
  # hub_supplier.yml: Task 1 deliberately did not declare the Fieldglass invoice
  # source union, so naming the real union view here before it exists would make
  # checks/apply_source_unions.py fail every run and take the live
  # fieldglass_us_job_posting load down with it. bronze_table therefore points at the
  # fake hfig_usnc.bronze PLACEHOLDER catalog -- except it does not, any more: see the
  # bronze_table below, which reads the real table directly.
  #
  # REPOINT THIS in the same change that repoints hub_invoice.yml, hub_supplier.yml
  # and hub_worker.yml's FIELDGLASS_US binding, and declares the source union in
  # metadata/source_unions.yml. All four move together, or none of them should move.
  - name: FIELDGLASS_US
    # READS THE BRONZE TABLE DIRECTLY, with the profile's filter and renames applied
    # in the flow (conform:) instead of through a view. A masked entity reading a view
    # cannot be built -- SDP reconciles the streaming plan against the declared schema
    # at definition time and never finished. 25 September.
    bronze_table: 01_usnc_bronze_dev.sap_fieldglass_raw.invoices
    # GENERATION 2 since 28 September 2026. Bronze dropped and recreated this table
    # (new Delta id 06b65224-ef33-44fb-beb5-6ca4892277fb), so the generation-1
    # checkpoint names a Delta object that no longer exists and this flow fails at
    # analysis with [DIFFERENT_DELTA_TABLE_READ_BY_STREAMING_SOURCE]. See
    # SourceBinding.stream_generation: a fresh checkpoint re-reads the source and
    # APPENDS, and the duplicate staging rows dissolve at the hub anti-join.
    stream_generation: 2
    conform: fieldglass_us_invoice
    # WEEKLY, per Amy's 22 September template: "Invoice frequency: Weekly", delivered
    # Thursdays by sFTP. NOT an exemption -- a 0 here means a feed that legitimately never
    # re-delivers, and this one is meant to.
    #
    # IT WILL REPORT A BREACH TODAY, AND THAT IS THE POINT. Measured 24 September: this
    # feed has landed three times -- 5 rows on 8 Sep, 30 on 9 Sep, 1,172 on 11 Sep -- and
    # nothing in the thirteen days since. So it is not yet the weekly feed the template
    # describes. Declaring the real SLA makes that visible; exempting it would hide a
    # silent feed behind a decision that looks deliberate.
    freshness_sla_hours: 168
    key_columns: [buyer_tenant]
    key_literals:
      reference_type: Fieldglass_Buyer_Code
    # THE FEED RE-DELIVERS, and every row of it carries the same buyer, so without this the
    # hub stages 1,207 copies of one client per load. Required of every binding
    # reading a real Bronze table since this one stopped reading a view.
    dedup_by: [buyer_tenant]
    dedup_order: [invoice_submit_date]
    applied_dts_column: invoice_submit_date

  # PLACEHOLDER. csat_invoice_line_gie recomputes nhl_invoice_line's parent keys from the
  # vault under this source name, so the Fieldglass literal has to be declarable here too
  # -- see csat_invoice_line_gie.yml's sources: block. Same reference_type and key_columns
  # as the FIELDGLASS_US binding above (both assert the SAME buyer identity); a different
  # NAME only because a business-vault binding is excluded from the Bronze contract by
  # name, and FIELDGLASS_US is not a truthful rec_src for a row this satellite computed.
  #
  # ITS SIBLING, `BUSINESS_VAULT`, IS ON THE OTHER HUB NOW, and the split is what finally
  # makes the pair legible: the two never differed by source, they differed by WHAT THEY
  # IDENTIFY -- a buyer here, our own legal entity there. One binding name, one
  # key_literals value; they were only ever crowded into one hub because the hub was two
  # things at once.
  - name: BUSINESS_VAULT_GIE
    bronze_table: hfig_usnc.raw_vault.nhl_invoice_line
    key_columns: [buyer_tenant]
    key_literals:
      reference_type: Fieldglass_Buyer_Code

  # GREAT PLAINS CUSTOMERS, 29 September 2026. rm00101 is GP's receivables customer
  # master, and a GP customer is somebody who owes US money -- a client. It belongs on
  # this half of the split, not on hub_operating_company, and the reference_type literal
  # says so in the key rather than in a comment.
  #
  # NOT SCOPED BY input_db, AND THAT IS MEASURED RATHER THAN ASSUMED -- which matters,
  # because it is the OPPOSITE of the ruling on every other GP binding in this model.
  # gl00100's actindx and gl20000's jrnentry are per-company-database surrogates and are
  # scoped; pm00200's vendorid is a per-company sequence and is scoped (see
  # hub_supplier.yml). rm00101's custnmbr is not:
  #
  #     great_plains_raw.rm00101:  889 rows
  #                                345 distinct custnmbr
  #                                346 distinct (input_db, custnmbr)
  #
  # ONE collision, and it is a merge we WANT: `KCCA` is "KIMBERLY CLARK CANADA" in BARM
  # and "Kimberly Clark Canada" in CER -- the same customer carried in two sets of books,
  # spelled two ways. A shared key resolves them to one client, which is what a customer
  # number is for. Scoping by input_db here would mint two hub rows for one company and
  # every AR figure would have to be summed across them by hand.
  #
  # The contrast with the vendor side is not an inconsistency: GP mints a VENDOR id inside
  # one company database and a CUSTOMER number against a shared receivables list, so the
  # two questions have different measured answers and each is keyed on its own.
  #
  # dedup_by IS THE FULL KEY. 889 rows over 345 customers across five deliveries, so
  # without it the hub stages ~2.6 copies of every client per load. The literal is not
  # deduped on because it is constant for this binding.
  - name: GP_CUSTOMER
    bronze_table: 01_usnc_bronze_dev.great_plains_raw.rm00101
    key_columns: [custnmbr]
    key_literals:
      reference_type: GP_CUSTOMER
    # dex_row_ts, NOT modifdt -- the same choice hub_ledger_account's GP_US binding
    # already made, and measured again here: in rm00101's 889 rows dex_row_ts has 366
    # distinct values against modifdt's 183. Twice as granular, so it separates versions
    # modifdt would collapse into one. A second convention for the same source would be a
    # second thing to keep in step.
    applied_dts_column: dex_row_ts
    dedup_by: [custnmbr]
    dedup_order: [dex_row_ts, input_file_name]
