# THE CLIENT SIDE, AND IT IS FOR SPEND REPORTING BY CLIENT GROUP.
#
# Renamed 24 September, when a second hierarchy arrived and a bare "legal_entity_hierarchy"
# stopped saying which. The shape did not change; its placeholder source was already called
# CLIENT_PORTAL.
#
# WHAT IT ROLLS UP, AND WHY IT CANNOT COME FROM THE VMS. Measured across the invoice feed:
# 12 real buyer codes, one per client, with no sub-entity structure under any of them. A
# client group running several VMS programmes appears as several buyer codes and nothing in
# the feed says they belong together -- which is exactly the fact this hierarchy supplies.
# Company_Code/Company_Name look like they might carry it and do not: 352 of their 353
# values sit on rows with a blank buyer and no Invoice_ID, and they are STAFFING SUPPLIERS
# (Manpower, LanceSoft, Terra Staffing Group).
#
# AMY KESER, 24 September: "where we have multiple legal entities (children) we need 1
# overarching client record (parent) -- the parent ID is the key for reporting on total
# spend across multiple records". And in the same message: "this is not applicable to all
# (Ameren as an example)". So MOST clients have no parent at all, and a projection that
# groups by parent id drops them silently. See accelerator.hierarchy.rollup_key.
#
# AS-IS BY DEFAULT, decided 24 September: spend rolls up the structure as it stands today,
# so year-on-year comparison is like-for-like, at the cost of restating history when a
# client restructures. As-was stays reachable through the effectivity satellite, and
# tests/test_accelerator.py exercises it so that defaulting to as-is does not quietly
# retire it.
#
# HIERARCHICAL LINK -- the DV 2.0 construct for a hub related to ITSELF.
#
# A link normally joins two different hubs. A HIERARCHICAL LINK (hal) joins one hub to
# itself to express parent/child: Guidant Global is a child of Impellam Group; Impellam
# Group and HeadFirst Group become children of the unified brand. Same construct that
# carries org charts, account rollups and bills of material in DV 2.0.
#
# WHY A HAL RATHER THAN A COLUMN ON THE HUB. A `parent_code` column on hub_legal_entity
# would be a descriptive attribute on a hub, which this model refuses to build, and for a
# good reason here: a hub is immutable and ownership is not. Putting the parent on the hub
# means the day the brand unifies, we either UPDATE a hub row -- in an insert-only vault --
# or re-key it, orphaning every satellite behind it. As a link, a change in ownership is a
# NEW ROW. Nothing is rewritten and the old structure stays queryable, which is what makes
# "what did this group look like in March" answerable at all.
#
# THE REBRAND IS THE TEST CASE, AND IT IS WEEKS AWAY. Impellam Group and HeadFirst Group
# unify under a new brand. In this shape that is: one new hub row for the new entity, two
# new rows here (new -> Impellam, new -> HeadFirst), and two end-dates on the effectivity
# satellite. No key changes. No reload. Every historical fact still rolls up the way it
# did when it was recorded, and every new fact rolls up the new way.
#
# ROLES ARE MANDATORY HERE AND THE MODEL ENFORCES IT. Both legs point at legal_entity, so
# without parent_roles the two would share one foreign-key column and the link key would
# hash one leg twice. Measured 5 Sep 2026 before parent_roles existed: such an entity
# LOADED, emitted a single `legal_entity_hk`, and produced a hierarchy in which every node
# was its own parent -- with no error anywhere. spec.validate now refuses it.
name: client_legal_entity_hierarchy
kind: hal
domain: reference
# VERSION 2 FOR THE STAGING MATERIALISATION ALONE. Three of the eleven keyed non-hub
# entities carry no renamed hash-key column -- the split did not reach their parents --
# and this is one of them. The bump is still required, and for the reason that applies
# to all eleven: this entity is no longer written directly by the SDP pipeline but built
# by checks/load_hubs.py from the staging log
# `stg_hal_client_legal_entity_hierarchy_rev2` by anti-join, and a job task cannot
# INSERT into a streaming table.
#
# IT IS NOT A SHAPE CHANGE. The columns are identical on both sides; what differs is who
# writes the table and how duplicates are eliminated.
#
# naming.physical("hal_client_legal_entity_hierarchy", 2) ->
# hal_client_legal_entity_hierarchy_rev2, and the stable view
# `hal_client_legal_entity_hierarchy` keeps pointing at
# hal_client_legal_entity_hierarchy_rev1 until checks/cutover_vault_version.py
# deliberately moves it -- a separate, gated decision that is NOT part of declaring this
# version. See docs/superpowers/plans/2026-09-29-keyed-kind-staging-runbook.md §7, whose
# version table this number is asserted against.
version: 2
sensitivity: internal

# ORDER IS THE DIRECTION OF THE EDGE, and it is the only thing this table carries, so the
# roles are named rather than positional-by-convention. parent_legal_entity_hk is the
# owner; child_legal_entity_hk is the owned. A reader who gets this backwards inverts
# every rollup while every row still joins.
parents: [legal_entity, legal_entity]
parent_roles: [parent, child]

notes: >
  Parent/child ownership between legal entities, as a hierarchical link so that a change
  in structure is an insert rather than an update. Read direction from the column names:
  parent_legal_entity_hk owns child_legal_entity_hk. WHEN an edge was true is not here --
  it is on esat_legal_entity_hierarchy, because the same pair can be effective, end, and
  in principle resume. Traversing this table without joining the effectivity satellite
  gives you every relationship that has ever held, which is rarely the question asked.

sources:

  # THE REAL SOURCE, declared 25 September 2026 -- see hub_legal_entity.yml for why Hubspot
  # and what is assumed about hs_object_id.
  #
  # IT READS THE FILTERED VIEW, NOT THE TABLE. Only 144 of 2,457 companies carry a parent.
  # Binding straight to companies would emit an edge for every company and hash a NULL into
  # the parent leg for the other 2,313. The view's row_filter is what makes this a
  # hierarchy rather than a fiction; metadata/source_unions.yml carries the reasoning.
  - name: HUBSPOT
    # READS THE BRONZE TABLE DIRECTLY, with the profile's filter and renames applied
    # in the flow (conform:) instead of through a view. A masked entity reading a view
    # cannot be built -- SDP reconciles the streaming plan against the declared schema
    # at definition time and never finished. 25 September.
    bronze_table: 01_usnc_bronze_dev.hubspot_raw.companies
    conform: hubspot_client_legal_entity_parent
    # KEYED BY ROLE, as the placeholder above already was: both legs are hub_legal_entity,
    # so a hub-keyed mapping resolves both to one entry. The view emits these two names
    # precisely so that repointing changes the SOURCE and not the keying.
    parent_keys:
      parent: [parent_legal_entity_code]
      child: [child_legal_entity_code]
    dedup_by: [child_legal_entity_code, parent_legal_entity_code]
    dedup_order: [hs_lastmodifieddate]
    applied_dts_column: hs_lastmodifieddate
    freshness_sla_hours: 24
