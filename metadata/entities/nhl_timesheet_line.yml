# Non-historized link: a timesheet line is immutable by nature. Payload sits on the
# link, there is no hashdiff and no end-dating.
#
# transaction_key carries the source's own reference PLUS line_no, a DEPENDENT CHILD
# KEY. Omit line_no and week 34's five lines collapse into one row.
#
# UNIT OF WORK: every hub participating in the real event is declared here, so one
# row reads back as a complete statement of what happened. Splitting this into
# narrower links would make the event unrecoverable.
# PLACEHOLDER BRONZE TABLES: every bronze_table below is a placeholder.
# Replace with the real fully-qualified table in db-weu-datalakehouse-tds
# before deploying -- the pipeline fails at definition time otherwise.
# See DEPLOY.md Phase 0a.
name: timesheet_line
kind: nhl
domain: pay_bill
# VERSION 2, AND ONE BUMP SERVES BOTH REASONS. That is the whole benefit of combining
# the keyed-kind staging migration with the hub split instead of running them in
# sequence: separately, the eleven keyed non-hub entities would each have been versioned
# twice -- twenty version operations rather than thirteen, and two cutovers per entity
# on a stable view whose grants are dropped by every one of them (runbook §2.1).
#
#   1. KEYED-KIND STAGING. This entity is no longer written directly by the SDP
#      pipeline. It is a batch-loaded table that checks/load_hubs.py builds from the
#      staging log `stg_nhl_timesheet_line_rev2` by anti-join, and a job task cannot
#      INSERT into a streaming table -- so the loader needs a NEW physical table, not an
#      altered one.
#   2. THE HUB SPLIT. `organisation_hk` is now `client_hk` here. A column rename is a
#      schema migration and `delta.appendOnly=true` forbids one in place.
#
# NOT ONE HASH-KEY EXPRESSION MOVED, only the column NAME -- asserted byte for byte
# against tests/golden_key_expressions.json, which was rendered before the split. A
# rename is recoverable; a digest change is not, and the two are distinguished by
# comparing the expression under the renamed identity rather than the identity itself.
#
# naming.physical("nhl_timesheet_line", 2) -> nhl_timesheet_line_rev2, and the stable
# view `nhl_timesheet_line` keeps pointing at nhl_timesheet_line_rev1 until
# checks/cutover_vault_version.py deliberately moves it -- a separate, gated decision
# that is NOT part of declaring this version. The operator sequence is
# docs/superpowers/plans/2026-09-29-keyed-kind-staging-runbook.md; its §7 carries the
# version table this number is asserted against, so bumping it here without amending
# that table reds tests/test_accelerator.py.
version: 2
key_style: federated
parents: [worker, job_request, client]
transaction_key: [timesheet_reference, line_no]
sensitivity: financial

# MASKS are declared HERE, not applied by ALTER TABLE afterwards.
# Row filters and column masks on streaming tables and materialized views must be set
# through the table definition, so the factory emits them and the governance task only
# creates the FUNCTIONS. See DEPLOY.md Phase 6.
masks:
  rate: governance.mask_money
  amount: governance.mask_money

payload:
  - week_ending
  - units
  - unit_type
  - rate
  - amount
  - currency
  - time_type
sources:
  - name: STRIIVE_EU
    bronze_table: hfig_eu.bronze.striive_timesheet_line
    parent_keys:
      worker: [worker_ref]
      job_request: [job_reference]
      client: [client_code]
    payload: [week_ending, units, unit_type, rate, amount, currency, time_type]
    applied_dts_column: submitted_at
    cdc_op_column: _cdc_op
    manifest_column: approval_manifest_id
    expectations: [units_non_negative, week_ending_valid]
