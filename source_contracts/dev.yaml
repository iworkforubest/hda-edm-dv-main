generated_from: metadata/entities/*.yml
limits:
  declared_not_required: Each table's declared_not_required (a sibling of requires,
    not a member of it) lists columns the model records against a binding on that
    table without asking Bronze to guarantee them -- today only dedup_order, which
    is declared per binding but not applied by the streaming path, and may include
    Spark's own file-metadata column rather than anything Bronze holds.
  expectation_columns_not_listed: This lists the columns the MODEL reads, plus the
    two compiled-in key-safety rules. Governed data-quality rules live in control.ref_dq_expectation
    and their SQL is read at pipeline runtime, where it may name ANY source column.
    So a change to a column only a governed rule references can break a load this
    document never mentioned. Reading those rules here would make a committed, offline-reproducible
    artefact depend on workspace state, so the gap belongs to a live check instead.
  types_are_requirements: Every type here is a type Silver REQUIRES, never an observation
    about what Bronze holds. Bronze's own column types are not modelled in this repository,
    so this document cannot and does not describe them.
merge_note: Where several read_by bindings on one table disagree about applied_dts,
  cdc_op or manifest, every distinct value required is listed here, but NOT attributed
  to which binding needs which -- the merge unions VALUES, not bindings. As generated,
  no two active bindings on the same table disagree on any of these three roles (every
  populated list below has exactly one entry); if that ever changes, cross-reference
  read_by against metadata/entities/*.yml to find which binding wants which value.
standing: This is Silver's stated dependency on Bronze, generated from metadata/entities/*.yml.
  It is NOT an agreement Bronze has countersigned.
target: dev
