dataContractSpecification: 1.1.0
entities:
  csat_invoice_line_gie_rev1:
    columns:
      accounting_date:
        classification: internal
        description: AME009 -- from the week-ending date. See the open question on
          its format.
        type: source-derived
      amount:
        classification: financial
        description: 'AME008 -- the line amount for an ITEM line, being the CLIENT
          amount: invoice_line_item_amount_client from the raw vault, which is the
          supplier cost plus that line''s MSP margin. Not the supplier figure. Tax
          is aggregated onto the final TAX line and all lines sum to the invoice gross.
          Named `amount` because Ameren''s template names the column `Amount`; the
          thirteen gold field names are the customer''s contract and are not ours
          to rename. Masked by governance.mask_money.'
        maskFunction: governance.mask_money
        type: DECIMAL(18,2)
      applied_dts:
        classification: internal
        description: When this row's change happened in the SOURCE. May arrive late,
          and may be NULL where a feed ships no business clock. Type-2 end-dating
          runs on this, never on load_dts.
        type: TIMESTAMP
      batch_id:
        classification: internal
        description: The load run that wrote this row, for tracing a value back to
          the run that produced it.
        type: STRING
      cdc_op:
        classification: internal
        description: 'The change operation Bronze delivered: I, U or D. What the SOURCE
          said happened, not what this vault did with it.'
        type: STRING
      description:
        classification: internal
        description: AME004 -- invoice id, worker as Last First, week-ending and line
          ref, pipe delimited.
        type: source-derived
      expenditure_organization:
        classification: internal
        description: AME013 -- the expenditure organization belonging to the line's
          module.
        type: source-derived
      expenditure_type:
        classification: internal
        description: AME012 -- the expenditure type belonging to the line's module.
        type: source-derived
      hashdiff:
        classification: internal
        description: 'SHA-256 over this satellite''s payload. Change detection: a
          new version is written only when this differs from the row before it, so
          an unchanged re-delivery costs nothing.'
        type: BINARY(32)
      invoice_amount:
        classification: financial
        description: 'AME003 -- the invoice gross, repeated on every line of the invoice,
          from sat_invoice_header.gross_invoice_amount. The reconciliation target.
          A DIFFERENT GRAIN FROM `amount` AND FROM THE RAW VAULT''S LINE COLUMN: this
          is the whole invoice''s value on every line, which is what Ameren''s template
          asks for and what AME008 checks the lines against. The raw vault''s per-line
          client amount is called invoice_line_item_amount_client precisely so that
          these two cannot be confused by a projection -- Spark resolves identifiers
          case-insensitively, so one name for two grains is either an AMBIGUOUS_REFERENCE
          or, worse, a silent pick. Masked by governance.mask_money.'
        maskFunction: governance.mask_money
        type: DECIMAL(18,2)
      invoice_line_hk:
        classification: internal
        description: Foreign key to nhl_invoice_line, hashed exactly as that table's
          own loader hashes it -- so the join holds by construction rather than by
          careful copying.
        primaryKey: true
        references: 02_usnc_silver_edm_dev.raw_vault.nhl_invoice_line.invoice_line_hk
        type: BINARY(32)
      line_description:
        classification: internal
        description: AME005 -- the same without the invoice id.
        type: source-derived
      line_type:
        classification: internal
        description: AME007 -- TAX where the source type is Tax, otherwise ITEM.
        type: source-derived
      load_dts:
        classification: internal
        description: When WE learned this row, set by the load and monotonic within
          a run. Not when it happened in the source -- that is applied_dts.
        primaryKey: true
        type: TIMESTAMP
      manifest_id:
        classification: internal
        description: The delivery manifest this row was approved under. Loop-1 reconciliation
          compares what a manifest approved against what landed and what was quarantined.
        type: STRING
      project_number:
        classification: internal
        description: AME010 -- the source project code, unchanged.
        type: source-derived
      rec_src:
        classification: internal
        description: Which feed delivered this row. Provenance, NOT identity -- never
          join on it. The source name is already hashed into a federated key, so joining
          on both would be asserting the same thing twice.
        type: STRING
      rule_version:
        classification: internal
        description: The version of src/accelerator/invoice_rules.py that produced
          this row. Present so a rule change is visible in the data rather than only
          in git history.
        type: source-derived
      sub_seq:
        classification: internal
        description: Intra-batch ordering, used only to break a tie when two rows
          share a load_dts. Carries no business meaning and is never a business key.
        primaryKey: true
        type: INT
      task_number:
        classification: internal
        description: AME011 -- the value after the pipe in the module's task code,
          trailing parenthesis removed. A code with no pipe yields the whole code
          rather than a blank.
        type: source-derived
    description: ''
    domain: pay_bill
    foreign_keys:
      invoice_line_hk: 02_usnc_silver_edm_dev.raw_vault.nhl_invoice_line.invoice_line_hk
    grain: transaction
    kind: csat
    physical_name: 02_usnc_silver_edm_dev.business_vault.csat_invoice_line_gie_rev1
    primary_key:
    - invoice_line_hk
    - load_dts
    - sub_seq
    sensitivity: financial
    stable_name: 02_usnc_silver_edm_dev.business_vault.csat_invoice_line_gie
    storage:
      clustering_keys:
      - load_dts
