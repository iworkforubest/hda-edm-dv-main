info:
  description: 'Generated by tools/emit_data_contract.py from metadata/entities/*.yml.
    Never hand-edited -- regenerate and commit the diff. The `entities` section below
    is keyed on PHYSICAL TABLE names, one entry per table: a satellite has one table
    per source binding, so job_request_details appears as sat_job_request_details_striive_eu,
    _bullhorn_eu, _fieldglass_eu and _prounity_eu, each carrying that binding''s own
    columns, which genuinely differ. Two targets can resolve the identical catalog
    and schemas (their entries below then match byte for byte); the `target` field
    above is how a reader tells that apart from a copy error.'
  title: HFIG Data Vault Accelerator -- usnc_tds
  version: 0.2.0
quality:
  description: 'control.ref_dq_expectation holds governed data-quality rules but lives
