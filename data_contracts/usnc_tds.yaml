        type: source-derived
      gross_invoice_amount:
        classification: financial
        description: 'The invoice total CHARGED TO THE CLIENT, inclusive of MSP margin
          and before tax. AME003 repeats this on every line and AME008 asserts the
          lines sum to it -- so this column is the reconciliation target, not a convenience
          copy. Settled 24 September 2026: the client total is what Ameren is invoiced,
          and the supplier total (gross_supplier_invoice_amount) is the underlying
          cost. The two differ by the MSP margin, measured at 24,054.04 across 380
          of 419 invoices. Masked by governance.mask_money.'
        maskFunction: governance.mask_money
        type: DECIMAL(18,2)
      hashdiff:
        classification: internal
        description: 'SHA-256 over this satellite''s payload. Change detection: a
