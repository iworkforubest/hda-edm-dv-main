      severity: drop
      source: compiled-in
  severities:
    drop: honoured -- a violating row is dropped and written to the quarantine twin;
      the load continues (factory.py's _valid/_invalid append flows)
    fail: declarable in control.ref_dq_expectation's schema, but not implemented --
      this emitter refuses it if passed in, because @dp.expect_all_or_drop is never
      actually invoked (DEF-18) and nothing stops a load
    warn: declarable in control.ref_dq_expectation's schema, but not implemented --
      this emitter refuses it if passed in, because no advisory-only mechanism exists
