  sat_supplier_details_gp_vendor_rev1:
    columns:
      applied_dts:
        classification: internal
        description: When this row's change happened in the SOURCE. May arrive late,
          and may be NULL where a feed ships no business clock. Type-2 end-dating
          runs on this, never on load_dts.
        type: TIMESTAMP
      batch_id:
        classification: internal
        description: The load run that wrote this row, for tracing a value back to
          the run that produced it.
        type: STRING
      cdc_op:
        classification: internal
        description: 'The change operation Bronze delivered: I, U or D. What the SOURCE
          said happened, not what this vault did with it.'
        type: STRING
      curncyid:
        classification: internal
        description: The vendor's default currency code. An identifier, not an amount.
        type: source-derived
      hashdiff:
        classification: internal
        description: 'SHA-256 over this satellite''s payload. Change detection: a
          new version is written only when this differs from the row before it, so
          an unchanged re-delivery costs nothing.'
        type: BINARY(32)
      load_dts:
        classification: internal
        description: When WE learned this row, set by the load and monotonic within
          a run. Not when it happened in the source -- that is applied_dts.
        primaryKey: true
        type: TIMESTAMP
      manifest_id:
        classification: internal
        description: The delivery manifest this row was approved under. Loop-1 reconciliation
          compares what a manifest approved against what landed and what was quarantined.
        type: STRING
      pymtrmid:
        classification: internal
        description: The vendor's default payment terms code. An identifier, not an
          amount.
        type: source-derived
      rec_src:
        classification: internal
        description: Which feed delivered this row. Provenance, NOT identity -- never
          join on it. The source name is already hashed into a federated key, so joining
          on both would be asserting the same thing twice.
        type: STRING
      sub_seq:
        classification: internal
        description: Intra-batch ordering, used only to break a tie when two rows
          share a load_dts. Carries no business meaning and is never a business key.
        primaryKey: true
        type: INT
      supplier_hk:
        classification: internal
        description: Foreign key to hub_supplier, hashed exactly as that table's own
          loader hashes it -- so the join holds by construction rather than by careful
          copying.
        primaryKey: true
        references: 02_usnc_silver_edm_dev.raw_vault.hub_supplier.supplier_hk
        type: BINARY(32)
      venddba:
        classification: internal
        description: The vendor's trading name -- "doing business as" -- where GP
          holds one. Frequently empty and frequently a different spelling of vendname
          rather than a different company.
        type: source-derived
      vendname:
        classification: internal
        description: 'The vendor''s name as Great Plains holds it, within one company''s
          books. Not a key and not reliable as one: 630 vendor ids carry different
          names in different operating companies, which is why the id is scoped rather
          than the name normalised.'
        type: source-derived
      vendshnm:
        classification: internal
        description: GP's short name for the vendor. A display convenience, carried
          because it is what appears on some GP reports and a reconciliation against
          them needs it.
        type: source-derived
      vendstts:
        classification: internal
        description: 'GP''s vendor status -- active, inactive, temporary, hold. Recorded
          and never filtered: a vendor on hold still owns payables history and must
          still resolve.'
        type: source-derived
    description: ''
    domain: party
    foreign_keys:
      supplier_hk: 02_usnc_silver_edm_dev.raw_vault.hub_supplier.supplier_hk
    grain: transaction
    kind: sat
    physical_name: 02_usnc_silver_edm_dev.raw_vault.sat_supplier_details_gp_vendor_rev1
