          compares what a manifest approved against what landed and what was quarantined.
        type: STRING
      net_invoice_amount:
        classification: financial
        description: 'THE SOURCE''S NAMES ARE INVERTED AND THIS IS THE LARGER FIGURE.
          Despite being called "net", this is the invoice total INCLUDING tax: measured
          across all 419 real invoices, net_invoice_amount = gross_invoice_amount
          + invoice_adjustment_amount, without exception. Independently confirmed
          by Amy Keser''s `Ameren Invoice Value Analysis` of 24 September, which reaches
          the same reading from the client''s own figures. The columns keep the source''s
          spelling because the raw vault records what the source sent; this description
          is where the trap is named, because only 2 of the 419 invoices carry any
          tax, so on the other 417 the two columns are equal and the inversion is
          invisible. Masked by governance.mask_money.'
        maskFunction: governance.mask_money
        type: DECIMAL(18,2)
